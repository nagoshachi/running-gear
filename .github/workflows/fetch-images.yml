name: 商品画像を更新

on:
  schedule:
    - cron: "17 21 * * *"   # 毎日 6:17（日本時間）
  push:
    branches: [main]
    paths: ["products.json", "scripts/**"]
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: fetch-images
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Creators API から画像を取得
        env:
          AMAZON_CREDENTIAL_ID: ${{ secrets.AMAZON_CREDENTIAL_ID }}
          AMAZON_CREDENTIAL_SECRET: ${{ secrets.AMAZON_CREDENTIAL_SECRET }}
        run: python scripts/fetch_images.py
      - name: 変更を保存
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add products.json
          if git diff --cached --quiet; then echo "変更なし"; exit 0; fi
          git commit -m "商品画像を更新"
          git pull --rebase origin main
          git push
